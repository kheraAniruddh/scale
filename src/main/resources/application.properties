spring.application.name=scale

# Ingest output locations and upload limit
ingest.users-dir=./data/users
ingest.tasks-dir=./data/tasks
ingest.max-file-size=5MB

# Container-level multipart limits follow the ingest limit (request allows multipart overhead)
spring.servlet.multipart.max-file-size=${ingest.max-file-size}
spring.servlet.multipart.max-request-size=6MB

# LLM classification (part 2). The API key comes from API_SECRET_KEY in .env (gitignored) or the environment.
spring.config.import=optional:file:.env[.properties]
llm.url=https://litellm-proxy.ml.scale.com/v1/chat/completions
llm.model=openai/gpt-4o
llm.api-key=${API_SECRET_KEY:}
llm.timeout=10s

classifier.max-retries=3
classifier.initial-backoff=500ms
classifier.task-categories=Legal,Automotive,Geography,Healthcare,Math,Music
classifier.user-specializations=Mechanic/Technician,Healthcare Professional,Legal Professional,Software Developer,Other,Student
